<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakuruHub – Flamingo banner (prototype)</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#083c3a; }

  /* Mirror of body.landing rules in app/nakuru/styles.css — run scripts/extract-flamingo-banner-images.mjs if assets change. */
  .flamingo-banner {
    --h: clamp(340px, 62vh, 620px);
    position: relative; height: var(--h); overflow: hidden; background:#7a2a10;
  }
  .flamingo-banner .fill {
    position:absolute; inset:-30px;
    background:url(public/images/flamingo-banner-fill.jpg) center/cover no-repeat;
    filter: blur(22px) saturate(1.2); transform: scale(1.1);
  }
  .flamingo-banner .photo {
    position:absolute; top:0; left:50%; height:100%; aspect-ratio: 736/1104;
    transform: translateX(-50%);
    background:url(public/images/flamingo-banner-photo.jpg) center/cover no-repeat;
    box-shadow: 0 0 60px rgba(0,0,0,.35);
  }
  .flamingo-banner .photo::before, .flamingo-banner .photo::after {
    content:""; position:absolute; top:0; bottom:0; width:18%; pointer-events:none;
  }
  .flamingo-banner .photo::before { left:0;  background:linear-gradient(to right, rgba(122,42,16,.55), transparent); }
  .flamingo-banner .photo::after  { right:0; background:linear-gradient(to left,  rgba(122,42,16,.55), transparent); }

  .water { position:absolute; left:0; right:0; bottom:0; height:42%; overflow:hidden; pointer-events:none; mix-blend-mode:soft-light; }
  .water i {
    position:absolute; left:-30%; width:160%; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
    animation: shimmer 6s ease-in-out infinite;
  }
  .water i:nth-child(1){ top:12%; animation-duration:7s; }
  .water i:nth-child(2){ top:30%; animation-duration:5s; animation-delay:-2s; }
  .water i:nth-child(3){ top:50%; animation-duration:8s; animation-delay:-4s; }
  .water i:nth-child(4){ top:68%; animation-duration:6s; animation-delay:-1s; }
  .water i:nth-child(5){ top:86%; animation-duration:9s; animation-delay:-5s; }
  @keyframes shimmer { 0%,100%{ transform:translateX(-12%); opacity:.25; } 50%{ transform:translateX(12%); opacity:1; } }

  .glow { position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 66% 38%, rgba(255,200,120,.35), transparent 45%);
    animation: glow 5s ease-in-out infinite; }
  @keyframes glow { 50% { opacity:.45; } }

  .flamingo-banner::after { content:""; position:absolute; left:0; right:0; bottom:0; height:60px;
    background:linear-gradient(to bottom, transparent, #064a47); }

  @media (prefers-reduced-motion: reduce){ .water i, .glow { animation:none; } }
</style>
</head>
<body>
<p style="margin:1rem;color:#b8e8e3;font-size:.875rem;text-align:center">
  Production: <code>components/landing/FlamingoBanner.tsx</code> · Open via <code>npm run dev</code> on the landing page.
</p>
<div class="flamingo-banner" role="img" aria-label="A flamingo standing in the water at sunset">
  <div class="fill"></div>
  <div class="photo"></div>
  <div class="glow"></div>
  <div class="water"><i></i><i></i><i></i><i></i><i></i></div>
</div>
</body>
</html>
